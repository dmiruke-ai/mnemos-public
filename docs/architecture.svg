<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="purpleg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#5e35b1"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="780" fill="#0b1020"/>

  <!-- Title -->
  <text x="40" y="42" fill="#e2e8f0" font-size="22" font-weight="600">Mnemos — Architecture</text>
  <text x="40" y="64" fill="#94a3b8" font-size="13">Persistent agentic memory · page-tree retrieval · 5-layer code semantic graph</text>

  <!-- ======================== USER SURFACES ======================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="1100" height="100" rx="10" fill="#111827" stroke="#1f2937"/>
  </g>
  <text x="60" y="124" fill="#94a3b8" font-size="11" letter-spacing="1.4">USER &amp; AGENT SURFACES</text>

  <g transform="translate(70, 138)">
    <rect width="320" height="48" rx="6" fill="url(#sky)"/>
    <text x="20" y="22" fill="#fff" font-size="14" font-weight="600">Dashboard</text>
    <text x="20" y="40" fill="#dbeafe" font-size="11">Next.js · :3002 · /memories /search /graph /codebases</text>
  </g>
  <g transform="translate(420, 138)">
    <rect width="320" height="48" rx="6" fill="url(#sky)"/>
    <text x="20" y="22" fill="#fff" font-size="14" font-weight="600">REST API</text>
    <text x="20" y="40" fill="#dbeafe" font-size="11">FastAPI · :8200 · /docs · 64 endpoints</text>
  </g>
  <g transform="translate(770, 138)">
    <rect width="320" height="48" rx="6" fill="url(#sky)"/>
    <text x="20" y="22" fill="#fff" font-size="14" font-weight="600">MCP Server</text>
    <text x="20" y="40" fill="#dbeafe" font-size="11">stdio / SSE · 27 tools · Claude Desktop, Cursor</text>
  </g>

  <!-- ======================== INGEST ======================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="540" height="220" rx="10" fill="#111827" stroke="#1f2937"/>
  </g>
  <text x="60" y="254" fill="#94a3b8" font-size="11" letter-spacing="1.4">INGEST PIPELINE</text>

  <g transform="translate(60, 270)">
    <rect width="160" height="36" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12">📄 PDF · MD · code</text>
  </g>
  <g transform="translate(240, 270)">
    <rect width="160" height="36" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12">🖼 image · audio · video</text>
  </g>
  <g transform="translate(420, 270)">
    <rect width="140" height="36" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12">🔗 imports (8 src)</text>
  </g>

  <g transform="translate(60, 326)">
    <rect width="500" height="46" rx="6" fill="url(#purpleg)"/>
    <text x="20" y="20" fill="#fff" font-size="13" font-weight="600">Map builders → page-tree writer</text>
    <text x="20" y="38" fill="#ede9fe" font-size="11">pdf.py · markdown.py · code.py · code_graph.py · infra_parsers/</text>
  </g>

  <g transform="translate(60, 386)">
    <rect width="500" height="46" rx="6" fill="url(#rose)"/>
    <text x="20" y="20" fill="#fff" font-size="13" font-weight="600">Embedding dispatcher (background poll · 30s)</text>
    <text x="20" y="38" fill="#fce7f3" font-size="11">mxbai-embed-large · pgvector · pending → completed</text>
  </g>

  <!-- ======================== STORAGE SUBSTRATES ======================== -->
  <g filter="url(#shadow)">
    <rect x="600" y="230" width="540" height="220" rx="10" fill="#111827" stroke="#1f2937"/>
  </g>
  <text x="620" y="254" fill="#94a3b8" font-size="11" letter-spacing="1.4">STORAGE SUBSTRATES (Postgres 16 + pgvector)</text>

  <g transform="translate(620, 270)">
    <rect width="240" height="50" rx="6" fill="url(#emerald)"/>
    <text x="16" y="20" fill="#fff" font-size="12" font-weight="600">memories</text>
    <text x="16" y="38" fill="#d1fae5" font-size="10">typed AKUs · embedding_status · tags · metadata</text>
  </g>
  <g transform="translate(880, 270)">
    <rect width="240" height="50" rx="6" fill="url(#emerald)"/>
    <text x="16" y="20" fill="#fff" font-size="12" font-weight="600">document_nodes · document_terms</text>
    <text x="16" y="38" fill="#d1fae5" font-size="10">page-tree · breadcrumb · back-of-book index</text>
  </g>
  <g transform="translate(620, 340)">
    <rect width="240" height="50" rx="6" fill="url(#amber)"/>
    <text x="16" y="20" fill="#fff" font-size="12" font-weight="600">code_symbols · code_relationships</text>
    <text x="16" y="38" fill="#fef3c7" font-size="10">AST · callgraph · imports · pg_trgm index</text>
  </g>
  <g transform="translate(880, 340)">
    <rect width="240" height="50" rx="6" fill="url(#amber)"/>
    <text x="16" y="20" fill="#fff" font-size="12" font-weight="600">infra_resources</text>
    <text x="16" y="38" fill="#fef3c7" font-size="10">terraform · k8s · GH-Actions · Dockerfile</text>
  </g>
  <g transform="translate(620, 408)">
    <rect width="240" height="32" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="20" fill="#cbd5e1" font-size="11">concepts · concept_relationships · entities</text>
  </g>
  <g transform="translate(880, 408)">
    <rect width="240" height="32" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="20" fill="#cbd5e1" font-size="11">embeddings · embedding_lsh · audit_log</text>
  </g>

  <!-- ======================== RETRIEVAL ======================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="480" width="1100" height="120" rx="10" fill="#111827" stroke="#1f2937"/>
  </g>
  <text x="60" y="504" fill="#94a3b8" font-size="11" letter-spacing="1.4">RETRIEVAL — three substrates · one funnel</text>

  <g transform="translate(60, 520)">
    <rect width="330" height="64" rx="6" fill="url(#emerald)"/>
    <text x="20" y="22" fill="#fff" font-size="13" font-weight="600">A · Symbol</text>
    <text x="20" y="42" fill="#d1fae5" font-size="11">pg_trgm GIN · exact + prefix</text>
    <text x="20" y="56" fill="#a7f3d0" font-size="10">find_symbol("authorize_payment") → ~1ms</text>
  </g>
  <g transform="translate(420, 520)">
    <rect width="330" height="64" rx="6" fill="url(#purpleg)"/>
    <text x="20" y="22" fill="#fff" font-size="13" font-weight="600">B · Vector</text>
    <text x="20" y="42" fill="#ede9fe" font-size="11">pgvector HNSW · semantic similarity</text>
    <text x="20" y="56" fill="#ddd6fe" font-size="10">semantic_search w/ Breadcrumb + Anchor</text>
  </g>
  <g transform="translate(780, 520)">
    <rect width="340" height="64" rx="6" fill="url(#amber)"/>
    <text x="20" y="22" fill="#fff" font-size="13" font-weight="600">C · Graph</text>
    <text x="20" y="42" fill="#fef3c7" font-size="11">Recursive CTE over code_relationships</text>
    <text x="20" y="56" fill="#fde68a" font-size="10">who_calls() · get_symbol_callgraph()</text>
  </g>

  <!-- ======================== INFRA ======================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="630" width="1100" height="120" rx="10" fill="#111827" stroke="#1f2937"/>
  </g>
  <text x="60" y="654" fill="#94a3b8" font-size="11" letter-spacing="1.4">INFRASTRUCTURE &amp; OBSERVABILITY</text>

  <g transform="translate(60, 670)">
    <rect width="200" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12" font-weight="600">Redis</text>
    <text x="14" y="42" fill="#94a3b8" font-size="11">arq queue · :6379</text>
  </g>
  <g transform="translate(280, 670)">
    <rect width="200" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12" font-weight="600">Worker</text>
    <text x="14" y="42" fill="#94a3b8" font-size="11">arq · OCR · PDF · imports</text>
  </g>
  <g transform="translate(500, 670)">
    <rect width="200" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12" font-weight="600">Prometheus</text>
    <text x="14" y="42" fill="#94a3b8" font-size="11">:9091 · 36 series · 15d retention</text>
  </g>
  <g transform="translate(720, 670)">
    <rect width="200" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12" font-weight="600">Grafana</text>
    <text x="14" y="42" fill="#94a3b8" font-size="11">:10210 · 13-panel dashboard</text>
  </g>
  <g transform="translate(940, 670)">
    <rect width="180" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="12" font-weight="600">Ollama</text>
    <text x="14" y="42" fill="#94a3b8" font-size="11">mxbai-embed-large · llama</text>
  </g>

  <!-- ARROWS -->
  <!-- surfaces → ingest -->
  <path d="M310 200 L310 230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M580 200 L580 230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M930 200 L580 230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

  <!-- ingest → storage -->
  <path d="M560 350 L600 350" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- storage → retrieval -->
  <path d="M580 450 L580 480" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M870 450 L870 480" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- retrieval back to surfaces (curved up the right side) -->
  <path d="M1140 540 C 1170 540, 1170 162, 1090 162" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
</svg>
